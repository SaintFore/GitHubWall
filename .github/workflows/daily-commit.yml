# GitHubWall - 每日自动提交 workflow
#
# 使用方法：
# 1. 将此文件复制到你的目标仓库（显示热力图的仓库）的 .github/workflows/ 目录
# 2. 在目标仓库的 Settings -> Secrets and variables -> Actions 中添加以下 secrets：
#    - PAT: 你的 GitHub Personal Access Token（需要 repo 权限）
# 3. 确保目标仓库已启用 GitHub Actions
#
# 生成 Personal Access Token：
# GitHub -> Settings -> Developer settings -> Personal access tokens -> Fine-grained tokens
# 权限：Contents (Read and write)

name: Daily Commit

on:
  # 每天 UTC 12:00 执行（北京时间 20:00）
  schedule:
    - cron: '0 12 * * *'

  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Make daily commit
        run: |
          # 生成随机内容确保 commit 不重复
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RANDOM_ID=$(cat /dev/urandom | head -c 8 | xxd -p)

          # 写入或更新贡献文件
          echo "Daily contribution: ${TIMESTAMP} - ${RANDOM_ID}" >> .contributions.log

          # 配置 git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 提交
          git add .contributions.log
          git commit -m "chore: daily contribution ${TIMESTAMP}" || echo "No changes to commit"

      - name: Push changes
        run: git push
